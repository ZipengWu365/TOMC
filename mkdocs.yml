site_name: TOMC Memory
site_description: TOMC Memory keeps the latest version of facts that changed, and prepares smaller task context for Claude Code, Codex, other MCP clients and LLM APIs.
docs_dir: docs
site_dir: site
# Design notes and the host validation record stay in the repository but are not
# published on the site; they cite local evidence under the ignored outputs/ directory.
exclude_docs: |
  /host_integration_validation_20261022.md
  /pet_design.md
  /plush_cat_asset.md
  /token_statistics_zh.md
  /tomc_dejected_expression_prompt.md
  /tomc_evolution_prompts.md
  /tomc_expression_prompts.md
  /tomc_material_prompts.md
markdown_extensions:
  - md_in_html
theme:
  name: mkdocs
  color_mode: light
