<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" aria-labelledby="title desc" role="img" viewBox="0 0 1280 560"><title id="title">A snapshot preserves the earlier value</title><desc id="desc">An actual synthetic compilation: backup_drink remains tea after drink changes to decaf tea. The copy depends on sources u0 and u2.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="none" stroke="#273343" stroke-width="1.4" d="M0 0L7 4L0 8"/></marker></defs><rect width="100%" height="100%" fill="#fff" rx="16"/><style>text{font-family:Arial,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#273343}.mono{font-family:ui-monospace,&apos;DejaVu Sans Mono&apos;,monospace}</style><text x="32" y="44" font-size="15" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">TOMC / SNAPSHOT SEMANTICS</text><text x="32" y="89" font-size="36" style="fill:#273343" class="label" font-weight="700" text-anchor="start">Copy now. Update the source later.</text><rect width="368" height="173" x="32" y="142" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="14"/><text x="50" y="178" font-size="23" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">1. Set the original</text><text x="50" y="220" font-size="17" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u0 drink = tea</text><text x="50" y="252" font-size="17" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u1 seat = window</text><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M410 227L440 227"/><rect width="368" height="173" x="456" y="142" fill="#fff5df" stroke="#97651b" stroke-width="1.8" rx="14"/><text x="474" y="178" font-size="23" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">2. Capture a snapshot</text><text x="474" y="220" font-size="17" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u2 backup_drink copies drink</text><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M834 227L864 227"/><rect width="368" height="173" x="880" y="142" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="14"/><text x="898" y="178" font-size="23" style="fill:#287451" class="label" font-weight="700" text-anchor="start">3. Update the source</text><text x="898" y="220" font-size="17" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u3 drink = decaf tea</text><text x="898" y="252" font-size="17" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u4 seat = aisle</text><rect width="400" height="121" x="248" y="379" fill="#fff5df" stroke="#97651b" stroke-width="1.8" rx="14"/><text x="268" y="413" font-size="23" style="fill:#97651b" class="mono" font-weight="700" text-anchor="start">backup_drink</text><text x="268" y="452" font-size="29" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">tea</text><text x="268" y="482" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">Evidence: u0, u2</text><rect width="432" height="121" x="816" y="379" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="14"/><text x="836" y="413" font-size="23" style="fill:#287451" class="mono" font-weight="700" text-anchor="start">drink</text><text x="836" y="452" font-size="29" style="fill:#287451" class="label" font-weight="700" text-anchor="start">decaf tea</text><text x="836" y="482" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">Evidence: u3</text><path fill="none" stroke="#273343" stroke-dasharray="6 5" stroke-width="2.4" marker-end="url(#arrow)" d="M640 325L448 366"/><path fill="none" stroke="#273343" stroke-dasharray="6 5" stroke-width="2.4" marker-end="url(#arrow)" d="M1064 325L1032 366"/><text x="32" y="544" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">Actual selected rows · 31 → 36 estimated tokens: provenance adds overhead on this tiny example.</text></svg>