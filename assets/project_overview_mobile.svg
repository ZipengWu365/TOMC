<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 520 1320"><title id="title">TOMC: from history to traceable memory</title><desc id="desc">TOMC compiles selected history into task-conditioned records and raw evidence under a budget for an unchanged LLM reader. The output illustrates the STATE route.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="none" stroke="#273343" stroke-width="1.4" d="M0 0L7 4L0 8"/></marker></defs><rect width="100%" height="100%" fill="#fff" rx="16"/><style>text{font-family:Arial,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#273343}.mono{font-family:ui-monospace,&apos;DejaVu Sans Mono&apos;,monospace}</style><text x="32" y="43" class="label" font-size="14" font-weight="700" text-anchor="start" style="fill:#356da6">TOMC / TASK-ORIENTED MEMORY COMPILATION</text><text x="32" y="87" class="label" font-size="29" font-weight="700" text-anchor="start" style="fill:#273343">History → traceable memory</text><rect width="456" height="278" x="32" y="130" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="14"/><text x="54" y="169" class="label" font-size="25" font-weight="700" text-anchor="start" style="fill:#356da6">01 History + task</text><text x="54" y="218" class="mono" font-size="20" font-weight="400" text-anchor="start" style="fill:#273343">drink = tea</text><text x="54" y="256" class="mono" font-size="20" font-weight="400" text-anchor="start" style="fill:#273343">backup_drink copies drink</text><text x="54" y="294" class="mono" font-size="20" font-weight="400" text-anchor="start" style="fill:#273343">drink = decaf tea</text><text x="54" y="350" class="label" font-size="23" font-weight="700" text-anchor="start" style="fill:#356da6">What is current?</text><text x="54" y="382" class="label" font-size="19" font-weight="400" text-anchor="start" style="fill:#273343">What did the earlier copy keep?</text><rect width="456" height="330" x="32" y="456" fill="#fafbf9" stroke="#287451" stroke-width="1.8" rx="14"/><text x="54" y="495" class="label" font-size="25" font-weight="700" text-anchor="start" style="fill:#287451">02 Select + compile</text><rect width="420" height="83" x="50" y="517" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="8"/><text x="66" y="549" class="label" font-size="25" font-weight="700" text-anchor="start" style="fill:#287451">Task-specific records</text><text x="66" y="579" class="label" font-size="17" font-weight="400" text-anchor="start" style="fill:#273343">State / key–value / relation / count</text><rect width="420" height="83" x="50" y="617" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="8"/><text x="66" y="649" class="label" font-size="25" font-weight="700" text-anchor="start" style="fill:#356da6">Raw evidence</text><text x="66" y="679" class="label" font-size="17" font-weight="400" text-anchor="start" style="fill:#273343">Keep relevant source wording</text><text x="54" y="741" class="label" font-size="19" font-weight="700" text-anchor="start" style="fill:#287451">Pack selected memory to a budget</text><text x="54" y="767" class="label" font-size="17" font-weight="400" text-anchor="start" style="fill:#273343">Training-free; reader unchanged</text><rect width="456" height="270" x="32" y="834" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="14"/><text x="54" y="873" class="label" font-size="25" font-weight="700" text-anchor="start" style="fill:#287451">03 Task-ready memory</text><text x="54" y="920" class="mono" font-size="19" font-weight="400" text-anchor="start" style="fill:#273343">backup_drink</text><text x="54" y="950" class="label" font-size="26" font-weight="700" text-anchor="start" style="fill:#97651b">tea</text><text x="54" y="1000" class="mono" font-size="19" font-weight="400" text-anchor="start" style="fill:#273343">drink</text><text x="54" y="1030" class="label" font-size="26" font-weight="700" text-anchor="start" style="fill:#287451">decaf tea</text><text x="54" y="1070" class="label" font-size="23" font-weight="700" text-anchor="start" style="fill:#287451">Memory → LLM reader</text><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M260 420L260 441"/><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M260 798L260 819"/><rect width="456" height="143" x="32" y="1140" fill="#fff5df" stroke="#97651b" stroke-width="1.8" rx="14"/><text x="50" y="1172" class="label" font-size="20" font-weight="700" text-anchor="start" style="fill:#97651b">Keep the evidence inspectable</text><text x="50" y="1201" class="mono" font-size="18" font-weight="400" text-anchor="start" style="fill:#273343">u0: drink = tea</text><text x="50" y="1230" class="mono" font-size="18" font-weight="400" text-anchor="start" style="fill:#273343">u2: backup_drink copies drink</text><text x="50" y="1259" class="label" font-size="18" font-weight="400" text-anchor="start" style="fill:#273343">Inspector outside the reader budget</text></svg>