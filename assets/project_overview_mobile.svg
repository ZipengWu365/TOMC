<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 520 1320"><title id="title">TOMC: from history to traceable memory</title><desc id="desc">TOMC compiles selected history into task-conditioned records and raw evidence under a budget for an unchanged LLM reader. The output illustrates the STATE route.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="none" stroke="#273343" stroke-width="1.4" d="M0 0L7 4L0 8"/></marker></defs><rect width="100%" height="100%" fill="#fff" rx="16"/><style>text{font-family:Arial,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#273343}.mono{font-family:ui-monospace,&apos;DejaVu Sans Mono&apos;,monospace}</style><text x="32" y="43" font-size="14" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">TOMC / TASK-ORIENTED MEMORY COMPILATION</text><text x="32" y="87" font-size="29" style="fill:#273343" class="label" font-weight="700" text-anchor="start">History → traceable memory</text><rect width="456" height="278" x="32" y="130" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="14"/><text x="54" y="169" font-size="25" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">01 History + task</text><text x="54" y="218" font-size="20" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink = tea</text><text x="54" y="256" font-size="20" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">backup_drink copies drink</text><text x="54" y="294" font-size="20" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink = decaf tea</text><text x="54" y="350" font-size="23" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">What is current?</text><text x="54" y="382" font-size="19" style="fill:#273343" class="label" font-weight="400" text-anchor="start">What did the earlier copy keep?</text><rect width="456" height="330" x="32" y="456" fill="#fafbf9" stroke="#287451" stroke-width="1.8" rx="14"/><text x="54" y="495" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">02 Select + compile</text><rect width="420" height="83" x="50" y="517" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="8"/><text x="66" y="549" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">Task-specific records</text><text x="66" y="579" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">State / key–value / relation / count</text><rect width="420" height="83" x="50" y="617" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="8"/><text x="66" y="649" font-size="25" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">Raw evidence</text><text x="66" y="679" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">Keep relevant source wording</text><text x="54" y="741" font-size="19" style="fill:#287451" class="label" font-weight="700" text-anchor="start">Pack selected memory to a budget</text><text x="54" y="767" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">Training-free; reader unchanged</text><rect width="456" height="270" x="32" y="834" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="14"/><text x="54" y="873" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">03 Task-ready memory</text><text x="54" y="920" font-size="19" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">backup_drink</text><text x="54" y="950" font-size="26" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">tea</text><text x="54" y="1000" font-size="19" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink</text><text x="54" y="1030" font-size="26" style="fill:#287451" class="label" font-weight="700" text-anchor="start">decaf tea</text><text x="54" y="1070" font-size="23" style="fill:#287451" class="label" font-weight="700" text-anchor="start">Memory → LLM reader</text><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M260 420L260 441"/><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M260 798L260 819"/><rect width="456" height="143" x="32" y="1140" fill="#fff5df" stroke="#97651b" stroke-width="1.8" rx="14"/><text x="50" y="1172" font-size="20" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">Keep the evidence inspectable</text><text x="50" y="1201" font-size="18" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u0: drink = tea</text><text x="50" y="1230" font-size="18" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u2: backup_drink copies drink</text><text x="50" y="1259" font-size="18" style="fill:#273343" class="label" font-weight="400" text-anchor="start">Inspector outside the reader budget</text></svg>