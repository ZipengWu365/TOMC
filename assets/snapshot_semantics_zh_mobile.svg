<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1080" aria-labelledby="title desc" role="img" viewBox="0 0 520 1080"><title id="title">快照保留复制时的值</title><desc id="desc">真实合成编译结果：drink 更新为 decaf tea 后，backup_drink 仍为 tea，依据来源 u0 和 u2。</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="none" stroke="#273343" stroke-width="1.4" d="M0 0L7 4L0 8"/></marker></defs><rect width="100%" height="100%" fill="#fff" rx="16"/><style>text{font-family:Arial,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#273343}.mono{font-family:ui-monospace,&apos;DejaVu Sans Mono&apos;,monospace}</style><text x="32" y="44" font-size="15" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">TOMC / 快照复制语义</text><text x="32" y="89" font-size="28" style="fill:#273343" class="label" font-weight="700" text-anchor="start">先复制，再更新来源。</text><rect width="456" height="140" x="32" y="130" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="14"/><text x="50" y="166" font-size="23" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">1. 设置初始值</text><text x="50" y="208" font-size="20" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u0 drink = tea</text><text x="50" y="240" font-size="20" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u1 seat = window</text><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M260 278L260 297"/><rect width="456" height="140" x="32" y="310" fill="#fff5df" stroke="#97651b" stroke-width="1.8" rx="14"/><text x="50" y="346" font-size="23" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">2. 复制当时的快照</text><text x="50" y="388" font-size="20" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u2 backup_drink copies drink</text><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M260 458L260 477"/><rect width="456" height="140" x="32" y="490" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="14"/><text x="50" y="526" font-size="23" style="fill:#287451" class="label" font-weight="700" text-anchor="start">3. 更新来源的当前值</text><text x="50" y="568" font-size="20" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u3 drink = decaf tea</text><text x="50" y="600" font-size="20" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u4 seat = aisle</text><rect width="456" height="125" x="32" y="710" fill="#fff5df" stroke="#97651b" stroke-width="1.8" rx="14"/><text x="52" y="744" font-size="23" style="fill:#97651b" class="mono" font-weight="700" text-anchor="start">backup_drink</text><text x="52" y="783" font-size="29" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">tea</text><text x="52" y="813" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">依据来源：u0, u2</text><rect width="456" height="125" x="32" y="858" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="14"/><text x="52" y="892" font-size="23" style="fill:#287451" class="mono" font-weight="700" text-anchor="start">drink</text><text x="52" y="931" font-size="29" style="fill:#287451" class="label" font-weight="700" text-anchor="start">decaf tea</text><text x="52" y="961" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">依据来源：u3</text><text x="32" y="1026" font-size="21" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">31 → 36 个估算 token</text><text x="32" y="1057" font-size="18" style="fill:#273343" class="label" font-weight="400" text-anchor="start">短例子会因来源标记增加开销。</text></svg>