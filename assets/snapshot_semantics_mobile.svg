<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1080" viewBox="0 0 520 1080" role="img" aria-labelledby="title desc">
<title id="title">A snapshot preserves the earlier value</title><desc id="desc">An actual synthetic compilation: backup_drink remains tea after drink changes to decaf tea. The copy depends on sources u0 and u2.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#273343" stroke-width="1.4"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="white"/>
<style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#273343}.mono{font-family:ui-monospace,'DejaVu Sans Mono',monospace}</style>
<text x="32" y="44" font-size="15" style="fill:#356da6" font-weight="700" text-anchor="start" class="label">TOMC  /  SNAPSHOT SEMANTICS</text>
<text x="32" y="89" font-size="28" style="fill:#273343" font-weight="700" text-anchor="start" class="label">Copy now. Update the source later.</text>
<rect x="32" y="130" width="456" height="140" rx="14" fill="#edf4fc" stroke="#356da6" stroke-width="1.8"/>
<text x="50" y="166" font-size="23" style="fill:#356da6" font-weight="700" text-anchor="start" class="label">1. Set the original</text>
<text x="50" y="208" font-size="20" style="fill:#273343" font-weight="400" text-anchor="start" class="mono">u0  drink = tea</text>
<text x="50" y="240" font-size="20" style="fill:#273343" font-weight="400" text-anchor="start" class="mono">u1  seat = window</text>
<path d="M260 278L260 297" fill="none" stroke="#273343" stroke-width="2.4" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="32" y="310" width="456" height="140" rx="14" fill="#fff5df" stroke="#97651b" stroke-width="1.8"/>
<text x="50" y="346" font-size="23" style="fill:#97651b" font-weight="700" text-anchor="start" class="label">2. Capture a snapshot</text>
<text x="50" y="388" font-size="20" style="fill:#273343" font-weight="400" text-anchor="start" class="mono">u2  backup_drink copies drink</text>
<path d="M260 458L260 477" fill="none" stroke="#273343" stroke-width="2.4" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="32" y="490" width="456" height="140" rx="14" fill="#edf6e8" stroke="#287451" stroke-width="1.8"/>
<text x="50" y="526" font-size="23" style="fill:#287451" font-weight="700" text-anchor="start" class="label">3. Update the source</text>
<text x="50" y="568" font-size="20" style="fill:#273343" font-weight="400" text-anchor="start" class="mono">u3  drink = decaf tea</text>
<text x="50" y="600" font-size="20" style="fill:#273343" font-weight="400" text-anchor="start" class="mono">u4  seat = aisle</text>
<rect x="32" y="710" width="456" height="125" rx="14" fill="#fff5df" stroke="#97651b" stroke-width="1.8"/>
<text x="52" y="744" font-size="23" style="fill:#97651b" font-weight="700" text-anchor="start" class="mono">backup_drink</text>
<text x="52" y="783" font-size="29" style="fill:#97651b" font-weight="700" text-anchor="start" class="label">tea</text>
<text x="52" y="813" font-size="17" style="fill:#273343" font-weight="400" text-anchor="start" class="label">Evidence: u0, u2</text>
<rect x="32" y="858" width="456" height="125" rx="14" fill="#edf6e8" stroke="#287451" stroke-width="1.8"/>
<text x="52" y="892" font-size="23" style="fill:#287451" font-weight="700" text-anchor="start" class="mono">drink</text>
<text x="52" y="931" font-size="29" style="fill:#287451" font-weight="700" text-anchor="start" class="label">decaf tea</text>
<text x="52" y="961" font-size="17" style="fill:#273343" font-weight="400" text-anchor="start" class="label">Evidence: u3</text>
<text x="32" y="1026" font-size="21" style="fill:#356da6" font-weight="700" text-anchor="start" class="label">31 → 36 estimated tokens</text>
<text x="32" y="1057" font-size="18" style="fill:#273343" font-weight="400" text-anchor="start" class="label">Tiny example; source metadata adds overhead.</text>
</svg>
