<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 520 1320"><title id="title">TOMC：从历史到可追溯记忆</title><desc id="desc">TOMC 将选中的历史编译成任务相关记录与原文证据，按预算组合后交给不变的大模型；输出以 STATE 路由为例。</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="none" stroke="#273343" stroke-width="1.4" d="M0 0L7 4L0 8"/></marker></defs><rect width="100%" height="100%" fill="#fff" rx="16"/><style>text{font-family:Arial,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#273343}.mono{font-family:ui-monospace,&apos;DejaVu Sans Mono&apos;,monospace}</style><text x="32" y="43" font-size="14" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">TOMC / TASK-ORIENTED MEMORY COMPILATION</text><text x="32" y="87" font-size="29" style="fill:#273343" class="label" font-weight="700" text-anchor="start">历史 → 可追溯的记忆</text><rect width="456" height="278" x="32" y="130" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="14"/><text x="54" y="169" font-size="25" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">01 历史与当前任务</text><text x="54" y="218" font-size="20" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink = tea</text><text x="54" y="256" font-size="20" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">backup_drink copies drink</text><text x="54" y="294" font-size="20" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink = decaf tea</text><text x="54" y="350" font-size="23" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">哪些状态现在有效？</text><text x="54" y="382" font-size="19" style="fill:#273343" class="label" font-weight="400" text-anchor="start">之前的副本保留了什么？</text><rect width="456" height="330" x="32" y="456" fill="#fafbf9" stroke="#287451" stroke-width="1.8" rx="14"/><text x="54" y="495" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">02 选取证据并编译</text><rect width="420" height="83" x="50" y="517" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="8"/><text x="66" y="549" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">任务相关记录</text><text x="66" y="579" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">状态 / 键值 / 关系 / 计数</text><rect width="420" height="83" x="50" y="617" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="8"/><text x="66" y="649" font-size="25" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">原文证据</text><text x="66" y="679" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">保留任务需要的原始措辞</text><text x="54" y="741" font-size="19" style="fill:#287451" class="label" font-weight="700" text-anchor="start">将所选记忆装入 token 预算</text><text x="54" y="767" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">无需训练；reader 模型不变</text><rect width="456" height="270" x="32" y="834" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="14"/><text x="54" y="873" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">03 任务所需的记忆</text><text x="54" y="920" font-size="19" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">backup_drink</text><text x="54" y="950" font-size="26" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">tea</text><text x="54" y="1000" font-size="19" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink</text><text x="54" y="1030" font-size="26" style="fill:#287451" class="label" font-weight="700" text-anchor="start">decaf tea</text><text x="54" y="1070" font-size="23" style="fill:#287451" class="label" font-weight="700" text-anchor="start">记忆 → 大模型 reader</text><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M260 420L260 441"/><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M260 798L260 819"/><rect width="456" height="143" x="32" y="1140" fill="#fff5df" stroke="#97651b" stroke-width="1.8" rx="14"/><text x="50" y="1172" font-size="20" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">保留可检查的来源证据</text><text x="50" y="1201" font-size="18" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u0: drink = tea</text><text x="50" y="1230" font-size="18" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u2: backup_drink copies drink</text><text x="50" y="1259" font-size="18" style="fill:#273343" class="label" font-weight="400" text-anchor="start">来源检查面板不计入 reader 预算</text></svg>