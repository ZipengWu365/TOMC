<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" aria-labelledby="title desc" role="img" viewBox="0 0 1280 660"><title id="title">TOMC：从历史到可追溯记忆</title><desc id="desc">TOMC 将选中的历史编译成任务相关记录与原文证据，按预算组合后交给不变的大模型；输出以 STATE 路由为例。</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="none" stroke="#273343" stroke-width="1.4" d="M0 0L7 4L0 8"/></marker></defs><rect width="100%" height="100%" fill="#fff" rx="16"/><style>text{font-family:Arial,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#273343}.mono{font-family:ui-monospace,&apos;DejaVu Sans Mono&apos;,monospace}</style><text x="32" y="43" font-size="14" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">TOMC / TASK-ORIENTED MEMORY COMPILATION</text><text x="32" y="91" font-size="36" style="fill:#273343" class="label" font-weight="700" text-anchor="start">将历史编译成下一步任务所需的记忆。</text><rect width="348" height="330" x="32" y="154" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="14"/><text x="54" y="193" font-size="25" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">01 历史与当前任务</text><text x="54" y="242" font-size="17" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink = tea</text><text x="54" y="280" font-size="17" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">backup_drink copies drink</text><text x="54" y="318" font-size="17" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink = decaf tea</text><text x="54" y="374" font-size="23" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">哪些状态现在有效？</text><text x="54" y="406" font-size="19" style="fill:#273343" class="label" font-weight="400" text-anchor="start">之前的副本保留了什么？</text><text x="54" y="450" font-size="16" style="fill:#356da6" class="label" font-weight="400" text-anchor="start">合成的规范化操作</text><rect width="348" height="330" x="456" y="154" fill="#fafbf9" stroke="#287451" stroke-width="1.8" rx="14"/><text x="478" y="193" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">02 选取证据并编译</text><rect width="312" height="83" x="474" y="215" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="8"/><text x="490" y="247" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">任务相关记录</text><text x="490" y="277" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">状态 / 键值 / 关系 / 计数</text><rect width="312" height="83" x="474" y="315" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="8"/><text x="490" y="347" font-size="25" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">原文证据</text><text x="490" y="377" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">保留任务需要的原始措辞</text><text x="478" y="439" font-size="19" style="fill:#287451" class="label" font-weight="700" text-anchor="start">将所选记忆装入 token 预算</text><text x="478" y="465" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">无需训练；reader 模型不变</text><rect width="368" height="330" x="880" y="154" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="14"/><text x="902" y="193" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">03 任务所需的记忆</text><text x="902" y="240" font-size="19" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">backup_drink</text><text x="902" y="270" font-size="26" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">tea</text><text x="902" y="320" font-size="19" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink</text><text x="902" y="350" font-size="26" style="fill:#287451" class="label" font-weight="700" text-anchor="start">decaf tea</text><text x="902" y="390" font-size="23" style="fill:#287451" class="label" font-weight="700" text-anchor="start">记忆 → 大模型 reader</text><text x="902" y="433" font-size="16" style="fill:#273343" class="label" font-weight="400" text-anchor="start">实际编译输出中的部分状态行</text><text x="902" y="460" font-size="18" style="fill:#273343" class="label" font-weight="400" text-anchor="start">状态附带来源指针</text><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M394 320L439 320"/><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M818 320L863 320"/><rect width="1216" height="92" x="32" y="528" fill="#fff5df" stroke="#97651b" stroke-width="1.8" rx="14"/><text x="54" y="564" font-size="24" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">来源证据始终可以核对</text><text x="54" y="596" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">独立来源检查面板 · 不计入 reader 预算</text><text x="720" y="564" font-size="18" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u0: drink = tea</text><text x="720" y="596" font-size="18" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u2: backup_drink copies drink</text><path fill="none" stroke="#273343" stroke-dasharray="6 5" stroke-width="2.4" marker-end="url(#arrow)" d="M206 493L206 514"/><path fill="none" stroke="#273343" stroke-dasharray="6 5" stroke-width="2.4" marker-end="url(#arrow)" d="M1064 493L1064 514"/></svg>