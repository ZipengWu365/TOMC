<svg xmlns="http://www.w3.org/2000/svg" width="480" height="750" aria-labelledby="title desc" role="img" viewBox="0 0 480 750"><title id="title">换个助手，项目接着做</title><desc id="desc">Codex 保存项目笔记，Claude Code 取回并追加更新，Codex 再读取最新笔记。两边在同一台电脑打开同一个 TOMC 记忆本，并显式调用存取工具。</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="none" stroke="#1b604a" stroke-width="1.5" d="M0 0L7 4L0 8"/></marker></defs><style>text{font-family:Arial,&apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}</style><rect width="100%" height="100%" fill="#fff" rx="18"/><text x="24" y="44" fill="#172a27" font-size="34" font-weight="700">换个助手，项目接着做</text><rect width="432" height="144" x="24" y="80" fill="#eef6f0" stroke="#d8ded5" stroke-width="1.5" rx="14"/><circle cx="52" cy="112" r="15" fill="#1b604a"/><text x="52" y="119" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">1</text><text x="78" y="121" fill="#172a27" font-size="28" font-weight="700">Codex</text><rect width="44" height="34" x="389" y="96" fill="#fff" stroke="#1b604a" stroke-width="2" rx="7"/><path fill="none" stroke="#1b604a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M400 107l6 6-6 6m12 0h9"/><text x="48" y="164" fill="#172a27" font-size="26" font-weight="600">保存项目笔记</text><text x="48" y="197" fill="#172a27" font-size="22" font-weight="500">决策、约束与下一步</text><path fill="none" stroke="#1b604a" stroke-width="2.5" marker-end="url(#arrow)" d="M240 235V248"/><rect width="432" height="144" x="24" y="258" fill="#fff8e9" stroke="#d8ded5" stroke-width="1.5" rx="14"/><circle cx="52" cy="290" r="15" fill="#97651b"/><text x="52" y="297" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">2</text><text x="78" y="299" fill="#172a27" font-size="28" font-weight="700">Claude Code</text><rect width="44" height="34" x="389" y="274" fill="#fff" stroke="#97651b" stroke-width="2" rx="7"/><path fill="none" stroke="#97651b" stroke-linecap="roun