<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" aria-labelledby="title description" role="img" viewBox="0 0 1000 540"><title id="title">Windows Codex · gpt-6.1-sol</title><desc id="description">Four context budgets; mean total request input 42191, 28713, 33344, 38035. All 45/45 correct. Paired reductions 29.7%, 19.5%, 9.2%.</desc><style>text{font-family:&quot;Noto Sans CJK SC&quot;,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,Arial,sans-serif;fill:#17212f}.muted{fill:#4d5c6f}</style><rect width="998" height="538" x="1" y="1" fill="#fff" stroke="#d7dfe8" rx="16"/><text x="38" y="46" font-size="28" font-weight="700" text-anchor="start">Windows Codex · gpt-6.1-sol</text><text x="38" y="78" class="muted" font-size="20" font-weight="400" text-anchor="start">合成历史中的最新状态问答</text><text x="962" y="46" font-size="30" font-weight="700" text-anchor="end">45/45</text><text x="962" y="77" class="muted" font-size="18" font-weight="400" text-anchor="end">每种预算均答对</text><text x="300" y="123" class="muted" font-size="19" font-weight="400" text-anchor="start">平均请求输入（token）</text><text x="957" y="123" class="muted" font-size="19" font-weight="400" text-anchor="end">配对减少</text><text x="38" y="179" font-size="20" font-weight="400" text-anchor="start">完整历史</text><rect width="421.91" height="30" x="300" y="155" fill="#8893a4" rx="3"/><text x="810" y="178" font-size="22" font-weight="600" text-anchor="end">42,191</text><text x="957" y="178" font-size="22" font-weight="600" text-anchor="end">参照</text><text x="38" y="243" font-size="20" font-weight="400" text-anchor="start">TOMC · 40% 预算</text><rect width="287.13" height="30" x="300" y="219" fill="#277cba" rx="3"/><text x="810" y="242" font-size="22" font-weight="600" text-anchor="end">28,713</text><text x="957" y="242" font-size="22" font-weight="600" text-anchor="end">−29.7%</text><text x="38" y="307" font-size="20" font-weight="400" text-anchor="start">TOMC · 60% 预算</text><rect width="333.44" height="30" x="300" y="283" fill="#83b4d8" rx="3"/><text x="810" y="306" font-size="22" font-weight="600" text-anchor="end">33,344</text><text x="957" y="306" font-size="22" font-weight="600" text-anchor="end">−19.5%</text><text x="38" y="371" font-size="20" font-weight="400" text-anchor="start">TOMC · 默认 80%</text><rect width="380.35" height="30" x="300" y="347" fill="#b5cadb" rx="3"/><text x="810" y="370" font-size="22" font-weight="600" text-anchor="end">38,035</text><text x="957" y="370" font-size="22" font-weight="600" text-anchor="end">−9.2%</text><text x="300" y="414" class="muted" font-size="17" font-weight="400" text-anchor="middle">0</text><text x="400" y="414" class="muted" font-size="17" font-weight="400" text-anchor="middle">10K</text><text x="500" y="414" class="muted" font-size="17" font-weight="400" text-anchor="middle">20K</text><text x="600" y="414" class="muted" font-size="17" font-weight="400" text-anchor="middle">30K</text><text x="700" y="414" class="muted" font-size="17" font-weight="400" text-anchor="middle">40K</text><text x="38" y="458" class="muted" font-size="18" font-weight="400" text-anchor="start">9 份历史（3 个 seed × 10K / 20K / 40K）；每种条件各回答一轮。</text><text x="38" y="488" class="muted" font-size="18" font-weight="400" text-anchor="start">减少比例为各份历史配对比例的均值，与条形长度的比值不同。</text><text x="38" y="518" class="muted" font-size="18" font-weight="400" text-anchor="start">输入包含缓存、宿主指令与工具定义；未测试完整编程工作流。</text></svg>