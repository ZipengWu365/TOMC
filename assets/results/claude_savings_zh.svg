<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" aria-labelledby="title description" role="img" viewBox="0 0 1000 690"><title id="title">Claude Code · Claude Opus 5.5</title><desc id="description">Answering-request USD costs for 10K, 20K and 40K histories, with full history or 40%/60% retention. Each shown condition answered 5/5 latest-state questions.</desc><style>text{font-family:&quot;Noto Sans CJK SC&quot;,&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,Arial,sans-serif;fill:#17212f}.muted{fill:#4d5c6f}</style><rect width="998" height="688" x="1" y="1" fill="#fff" stroke="#d7dfe8" rx="16"/><text x="38" y="46" font-size="28" font-weight="700" text-anchor="start">Claude Code · Claude Opus 5.5</text><text x="38" y="78" class="muted" font-size="20" font-weight="400" text-anchor="start">合成历史 · 单次回答请求费用（美元）</text><text x="960" y="46" font-size="30" font-weight="700" text-anchor="end">5/5</text><text x="960" y="77" class="muted" font-size="18" font-weight="400" text-anchor="end">每组条件均答对</text><text x="797" y="124" class="muted" font-size="19" font-weight="400" text-anchor="end">美元</text><text x="956" y="124" class="muted" font-size="19" font-weight="400" text-anchor="end">费用减少</text><text x="38" y="207" font-size="23" font-weight="600" text-anchor="start">约 10K</text><text x="38" y="234" class="muted" font-size="18" font-weight="400" text-anchor="start">token</text><text x="155" y="175" font-size="19" font-weight="400" text-anchor="start">完整历史</text><rect width="105.3" height="26" x="300" y="153" fill="#8893a4" rx="3"/><text x="797" y="174" font-size="22" font-weight="600" text-anchor="end">$0.169</text><text x="956" y="174" font-size="21" font-weight="600" text-anchor="end">参照</text><text x="155" y="212" font-size="19" font-weight="400" text-anchor="start">保留 40%</text><rect width="46.731" height="26" x="300" y="190" fill="#277cba" rx="3"/><text x="797" y="211" font-size="22" font-weight="600" text-anchor="end">$0.075</text><text x="956" y="211" font-size="21" font-weight="600" text-anchor="end">−56%</text><text x="155" y="249" font-size="19" font-weight="400" text-anchor="start">保留 60%</text><rect width="64.177" height="26" x="300" y="227" fill="#83b4d8" rx="3"/><text x="797" y="248" font-size="22" font-weight="600" text-anchor="end">$0.103</text><text x="956" y="248" font-size="21" font-weight="600" text-anchor="end">−39%</text><text x="38" y="349" font-size="23" font-weight="600" text-anchor="start">约 20K</text><text x="38" y="376" class="muted" font-size="18" font-weight="400" text-anchor="start">token</text><text x="155" y="317" font-size="19" font-weight="400" text-anchor="start">完整历史</text><rect width="208.108" height="26" x="300" y="295" fill="#8893a4" rx="3"/><text x="797" y="316" font-size="22" font-weight="600" text-anchor="end">$0.334</text><text x="956" y="316" font-size="21" font-weight="600" text-anchor="end">参照</text><text x="155" y="354" font-size="19" font-weight="400" text-anchor="start">保留 40%</text><rect width="87.854" height="26" x="300" y="332" fill="#277cba" rx="3"/><text x="797" y="353" font-size="22" font-weight="600" text-anchor="end">$0.141</text><text x="956" y="353" font-size="21" font-weight="600" text-anchor="end">−58%</text><text x="155" y="391" font-size="19" font-weight="400" text-anchor="start">保留 60%</text><rect width="121.5" height="26" x="300" y="369" fill="#83b4d8" rx="3"/><text x="797" y="390" font-size="22" font-weight="600" text-anchor="end">$0.195</text><text x="956" y="390" font-size="21" font-weight="600" text-anchor="end">−42%</text><text x="38" y="491" font-size="23" font-weight="600" text-anchor="start">约 40K</text><text x="38" y="518" class="muted" font-size="18" font-weight="400" text-anchor="start">token</text><text x="155" y="459" font-size="19" font-weight="400" text-anchor="start">完整历史</text><rect width="391.292" height="26" x="300" y="437" fill="#8893a4" rx="3"/><text x="797" y="458" font-size="22" font-weight="600" text-anchor="end">$0.628</text><text x="956" y="458" font-size="21" font-weight="600" text-anchor="end">参照</text><text x="155" y="496" font-size="19" font-weight="400" text-anchor="start">保留 40%</text><rect width="158.885" height="26" x="300" y="474" fill="#277cba" rx="3"/><text x="797" y="495" font-size="22" font-weight="600" text-anchor="end">$0.255</text><text x="956" y="495" font-size="21" font-weight="600" text-anchor="end">−59%</text><text x="155" y="533" font-size="19" font-weight="400" text-anchor="start">保留 60%</text><rect width="229.915" height="26" x="300" y="511" fill="#83b4d8" rx="3"/><text x="797" y="532" font-size="22" font-weight="600" text-anchor="end">$0.369</text><text x="956" y="532" font-size="21" font-weight="600" text-anchor="end">−41%</text><text x="300" y="564" class="muted" font-size="17" font-weight="400" text-anchor="middle">$0.0</text><text x="424.615" y="564" class="muted" font-size="17" font-weight="400" text-anchor="middle">$0.2</text><text x="549.231" y="564" class="muted" font-size="17" font-weight="400" text-anchor="middle">$0.4</text><text x="673.846" y="564" class="muted" font-size="17" font-weight="400" text-anchor="middle">$0.6</text><text x="38" y="610" class="muted" font-size="18" font-weight="400" text-anchor="start">每份历史包含 5 个最新状态问题；所有展示条件均为 5/5。</text><text x="38" y="640" class="muted" font-size="18" font-weight="400" text-anchor="start">百分比沿用原实验报告的舍入值；这组测试与 Codex 的请求协议不同。</text><text x="38" y="670" class="muted" font-size="18" font-weight="400" text-anchor="start">仅展示回答请求费用，不代表完整 Agent 会话的账单节省。</text></svg>