<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" aria-labelledby="title desc" role="img" viewBox="0 0 1280 660"><title id="title">TOMC: from history to traceable memory</title><desc id="desc">TOMC compiles selected history into task-conditioned records and raw evidence under a budget for an unchanged LLM reader. The output illustrates the STATE route.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><path fill="none" stroke="#273343" stroke-width="1.4" d="M0 0L7 4L0 8"/></marker></defs><rect width="100%" height="100%" fill="#fff" rx="16"/><style>text{font-family:Arial,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#273343}.mono{font-family:ui-monospace,&apos;DejaVu Sans Mono&apos;,monospace}</style><text x="32" y="43" font-size="14" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">TOMC / TASK-ORIENTED MEMORY COMPILATION</text><text x="32" y="91" font-size="36" style="fill:#273343" class="label" font-weight="700" text-anchor="start">Turn history into memory for the next task.</text><rect width="348" height="330" x="32" y="154" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="14"/><text x="54" y="193" font-size="25" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">01 History + task</text><text x="54" y="242" font-size="17" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink = tea</text><text x="54" y="280" font-size="17" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">backup_drink copies drink</text><text x="54" y="318" font-size="17" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink = decaf tea</text><text x="54" y="374" font-size="23" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">What is current?</text><text x="54" y="406" font-size="19" style="fill:#273343" class="label" font-weight="400" text-anchor="start">What did the earlier copy keep?</text><text x="54" y="450" font-size="16" style="fill:#356da6" class="label" font-weight="400" text-anchor="start">Synthetic normalized operations</text><rect width="348" height="330" x="456" y="154" fill="#fafbf9" stroke="#287451" stroke-width="1.8" rx="14"/><text x="478" y="193" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">02 Select + compile</text><rect width="312" height="83" x="474" y="215" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="8"/><text x="490" y="247" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">Task-specific records</text><text x="490" y="277" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">State / key–value / relation / count</text><rect width="312" height="83" x="474" y="315" fill="#edf4fc" stroke="#356da6" stroke-width="1.8" rx="8"/><text x="490" y="347" font-size="25" style="fill:#356da6" class="label" font-weight="700" text-anchor="start">Raw evidence</text><text x="490" y="377" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">Keep relevant source wording</text><text x="478" y="439" font-size="19" style="fill:#287451" class="label" font-weight="700" text-anchor="start">Pack selected memory to a budget</text><text x="478" y="465" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">Training-free; reader unchanged</text><rect width="368" height="330" x="880" y="154" fill="#edf6e8" stroke="#287451" stroke-width="1.8" rx="14"/><text x="902" y="193" font-size="25" style="fill:#287451" class="label" font-weight="700" text-anchor="start">03 Task-ready memory</text><text x="902" y="240" font-size="19" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">backup_drink</text><text x="902" y="270" font-size="26" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">tea</text><text x="902" y="320" font-size="19" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">drink</text><text x="902" y="350" font-size="26" style="fill:#287451" class="label" font-weight="700" text-anchor="start">decaf tea</text><text x="902" y="390" font-size="23" style="fill:#287451" class="label" font-weight="700" text-anchor="start">Memory → LLM reader</text><text x="902" y="433" font-size="16" style="fill:#273343" class="label" font-weight="400" text-anchor="start">Selected rows from the actual output</text><text x="902" y="460" font-size="18" style="fill:#273343" class="label" font-weight="400" text-anchor="start">Source links travel with the state</text><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M394 320L439 320"/><path fill="none" stroke="#273343" stroke-dasharray="none" stroke-width="2.4" marker-end="url(#arrow)" d="M818 320L863 320"/><rect width="1216" height="92" x="32" y="528" fill="#fff5df" stroke="#97651b" stroke-width="1.8" rx="14"/><text x="54" y="564" font-size="24" style="fill:#97651b" class="label" font-weight="700" text-anchor="start">Evidence stays inspectable</text><text x="54" y="596" font-size="17" style="fill:#273343" class="label" font-weight="400" text-anchor="start">Separate source inspector · outside the reader budget</text><text x="720" y="564" font-size="18" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u0: drink = tea</text><text x="720" y="596" font-size="18" style="fill:#273343" class="mono" font-weight="400" text-anchor="start">u2: backup_drink copies drink</text><path fill="none" stroke="#273343" stroke-dasharray="6 5" stroke-width="2.4" marker-end="url(#arrow)" d="M206 493L206 514"/><path fill="none" stroke="#273343" stroke-dasharray="6 5" stroke-width="2.4" marker-end="url(#arrow)" d="M1064 493L1064 514"/></svg>