name: Update clone traffic badges

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traffic.yml'
      - 'scripts/update_traffic.py'

permissions:
  contents: write

concurrency:
  group: traffic-badges
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ZipengWu365/TOMC'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect aggregate clone counts
        env:
          GH_TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "$GH_TRAFFIC_TOKEN" ]; then
            echo '::warning::Add TRAFFIC_TOKEN with repository Administration: read to enable collection.'
            echo 'Collection is not configured. The dated snapshot remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scripts/update_traffic.py
          echo 'Collected GitHub clone aggregates and updated dated badges.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish snapshot and release inventory
        run: |
          python scripts/release_manifest.py
          python scripts/release_manifest.py --check
          git add assets/traffic metrics/traffic README.md README_zh.md PUBLIC_RELEASE_MANIFEST.json SHA256SUMS
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update dated repository traffic snapshot'
          git push origin HEAD:main
