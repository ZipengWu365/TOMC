name: Refresh README release inventory once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/readme-manifest-once.yml']
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'ZipengWu365/TOMC'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Check figures and inventory the final files
        run: |
          python scripts/render_readme_results.py --check --update-readmes
          git rm .github/workflows/readme-manifest-once.yml
          python scripts/release_manifest.py
          python scripts/release_manifest.py --check
          git diff --check
          # The connector removes this one-shot file after the job succeeds.
          # Keep it out of the final inventory without asking GITHUB_TOKEN to edit workflows.
          git restore --source=HEAD --staged --worktree -- .github/workflows/readme-manifest-once.yml
      - name: Publish the two inventory files
        run: |
          git add PUBLIC_RELEASE_MANIFEST.json SHA256SUMS
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != {'PUBLIC_RELEASE_MANIFEST.json', 'SHA256SUMS'}:
              raise SystemExit(f'Unexpected staged files: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: synchronize release hashes after README figure update'
          git push origin HEAD:main
