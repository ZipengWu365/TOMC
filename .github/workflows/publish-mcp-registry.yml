name: Publish TOMC 0.1.1 to MCP Registry
on:
  push:
    branches: [ops/mcp-registry-0.1.1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tomc-registry-0.1.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ZipengWu365/TOMC' && github.ref == 'refs/heads/ops/mcp-registry-0.1.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      SOURCE_SHA: a6c75f2e4af4eed1528c0923176567766f52956c
      RELEASE_TAG: v0.1.1-assistant-preview.1
      GH_REPO: ZipengWu365/TOMC
    steps:
      - name: Check out the verified source snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: a6c75f2e4af4eed1528c0923176567766f52956c
          persist-credentials: false
      - name: Verify source inventory and both existing bundles
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python scripts/release_manifest.py --check
          cd plugins/downloads
          sha256sum --check tomc-memory-0.1.1.mcpb.sha256
          sha256sum --check tomc-memory-codex-0.1.1.zip.sha256
          echo 'f1186ac6cd146fd71a27e4444e189e398b894985a2d5fc66c8ca3a7a599512be  tomc-memory-0.1.1.mcpb' | sha256sum --check -
          echo '02398441bece2e858224b6eae9f90f10e7544719af006cc263eccc4507c5029a  tomc-memory-codex-0.1.1.zip' | sha256sum --check -
      - name: Check the packaged MCP runtime
        run: |
          python -m pip install 'mcp==1.30.0' 'uv' 'jsonschema>=4,<5'
          python scripts/plugin_smoke.py plugins/downloads/tomc-memory-0.1.1.mcpb
      - name: Prepare and validate public server metadata
        run: |
          python - <<'PY'
          import json, os, shutil, urllib.request
          from pathlib import Path
          import jsonschema
          work = Path(os.environ['RUNNER_TEMP']) / 'tomc-registry-publication'
          work.mkdir(exist_ok=True)
          repo = os.environ['GH_REPO']
          tag = os.environ['RELEASE_TAG']
          for name in ('tomc-memory-0.1.1.mcpb', 'tomc-memory-codex-0.1.1.zip'):
              for suffix in ('', '.sha256'):
                  shutil.copyfile(Path('plugins/downloads') / (name + suffix), work / (name + suffix))
          server = {
              '$schema': 'https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json',
              'name': 'io.github.ZipengWu365/tomc-memory',
              'title': 'TOMC Memory',
              'description': 'CPU task-specific context preparation and explicitly saved local project notes through MCP.',
              'repository': {'url': f'https://github.com/{repo}', 'source': 'github'},
              'websiteUrl': f'https://github.com/{repo}/blob/main/docs/assistant_plugin.md',
              'version': '0.1.1',
              'packages': [{
                  'registryType': 'mcpb',
                  'identifier': f'https://github.com/{repo}/releases/download/{tag}/tomc-memory-0.1.1.mcpb',
                  'fileSha256': 'f1186ac6cd146fd71a27e4444e189e398b894985a2d5fc66c8ca3a7a599512be',
                  'transport': {'type': 'stdio'}
              }]
          }
          with urllib.request.urlopen(server['$schema'], timeout=30) as response:
              schema = json.load(response)
          jsonschema.validate(server, schema)
          (work / 'server.json').write_text(json.dumps(server, indent=2) + '\n', encoding='utf-8')
          notes = (
              '# TOMC assistant packages 0.1.1\n\n'
              'This research preview distributes the existing MIT-licensed 0.1.1 assistant packages '
              f'from source commit `{os.environ["SOURCE_SHA"]}` as versioned release assets. '
              'Package bytes are unchanged from the checked-in download files. The compiler core remains 0.1.0.\n\n'
              'The packages include the host-managed conversation policy: task notes require explicit save and recall. '
              'TOMC does not automatically intercept native assistant conversations or provide cloud synchronization.\n\n'
              'The release includes MCP Registry metadata in `server.json`. A registry receipt is attached only '
              'after the public registry returns the matching version and package hash. No new model benchmark is claimed.\n\n'
              f'[Installation](https://github.com/{repo}#first-run-tomc) | '
              f'[Validation](https://github.com/{repo}/blob/{os.environ["SOURCE_SHA"]}/docs/validation.md)\n'
          )
          (work / 'notes.md').write_text(notes, encoding='utf-8')
          print('Validated registry metadata:', server['name'], server['version'])
          PY
      - name: Publish versioned release assets without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tomc-registry-publication"
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release already exists; verify it instead of replacing it.'
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" --target "$SOURCE_SHA" --prerelease --latest=false \
              --title 'TOMC assistant packages 0.1.1 (research preview)' --notes-file notes.md \
              tomc-memory-0.1.1.mcpb tomc-memory-0.1.1.mcpb.sha256 \
              tomc-memory-codex-0.1.1.zip tomc-memory-codex-0.1.1.zip.sha256 server.json
          fi
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir downloaded \
            --pattern 'tomc-memory-0.1.1.mcpb' --pattern 'tomc-memory-codex-0.1.1.zip' --pattern 'server.json'
          cmp server.json downloaded/server.json
          cmp tomc-memory-0.1.1.mcpb downloaded/tomc-memory-0.1.1.mcpb
          cmp tomc-memory-codex-0.1.1.zip downloaded/tomc-memory-codex-0.1.1.zip
          echo 'Release downloads match the verified source bundles and metadata.'
      - name: Install the pinned official registry publisher
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tomc-registry-publication"
          curl --fail --location --retry 2 --proto '=https' \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz' \
            --output publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check -
          tar -xzf publisher.tar.gz mcp-publisher
          chmod u+x mcp-publisher
      - name: Authenticate with GitHub OIDC and publish
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tomc-registry-publication"
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Verify the public registry entry
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          work = Path(os.environ['RUNNER_TEMP']) / 'tomc-registry-publication'
          expected = json.loads((work / 'server.json').read_text())
          name = urllib.parse.quote(expected['name'], safe='')
          url = f'https://registry.modelcontextprotocol.io/v0.1/servers/{name}/versions/{expected["version"]}'
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      actual = json.load(response)
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 404 or attempt == 5:
                      raise
                  time.sleep(5)
          server = actual.get('server', actual)
          if server.get('name') != expected['name'] or server.get('version') != expected['version']:
              raise SystemExit('Registry identity/version mismatch')
          if server.get('packages') != expected['packages']:
              raise SystemExit('Registry package metadata mismatch')
          receipt = {
              'verified_at': datetime.now(timezone.utc).isoformat(),
              'registry_url': url,
              'source_commit': os.environ['SOURCE_SHA'],
              'release_tag': os.environ['RELEASE_TAG'],
              'response': actual
          }
          (work / 'registry-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Published and verified: {expected["name"]} {expected["version"]}\n\n{url}\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Attach the public verification receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/tomc-registry-publication"
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" registry-receipt.json
