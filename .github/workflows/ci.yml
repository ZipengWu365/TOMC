name: Core, demo, evidence and release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[demo,dev,gateway,mcp]'
      - run: python -m pytest -q
      - run: ruff check . && ruff format --check .
      - run: python scripts/security_scan.py
      - run: python scripts/release_manifest.py --check
      - run: python benchmarks/reproduce/current.py
      - run: python benchmarks/reproduce/results.py
      - run: python scripts/make_beam_table.py --check
      - run: python scripts/build_claude_code_plugin.py --check
      - run: python scripts/benchmarks/codex_retention_report.py --verify-published docs/validation_data/windows_codex_retention_20261005.json
      - run: mkdocs build --strict
      - run: python -m build
      - name: Desktop companion UI tests on macOS (offscreen Qt)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -e '.[widget]'
          python -m pytest -q tests/test_usage_widget_language.py tests/test_savings_dashboard_qt.py \
            tests/test_context_library_qt.py tests/test_animation_receipts_qt.py \
            tests/test_pricing_language_qt.py tests/test_ui_language.py tests/test_macos_pet_window.py \
            tests/test_analysis_qt.py
      - name: Check packaged MCP runtime on macOS
        if: runner.os == 'macOS'
        run: |
          python -m pip install uv
          python scripts/build_plugin.py
          python scripts/build_codex_plugin.py
          version="$(python -c "import json; print(json.load(open('plugins/claude/manifest.json'))['version'])")"
          python scripts/plugin_smoke.py "outputs/plugins/tomc-memory-${version}.mcpb"
