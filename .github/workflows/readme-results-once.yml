name: Render README result figures once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/readme-results-once.yml']
permissions:
  contents: write
concurrency:
  group: readme-results-once
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'ZipengWu365/TOMC'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Check source snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {'README.md': 'af4f40c87bb8b00d4ef17e64004688d3c743519a', 'README_zh.md': '7e9901f93915e62517364b56b5c0f6a0383f22b1'}
          for filename, sha in expected.items():
              data = Path(filename).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != sha:
                  raise SystemExit(f'{filename} changed; review before editing')
          PY
      - name: Render and check figures
        run: |
          python scripts/render_readme_results.py --update-readmes
          python scripts/render_readme_results.py --check --update-readmes
          python -m pip install 'ruff>=0.11,<1'
          ruff check --fix scripts/render_readme_results.py
          ruff format scripts/render_readme_results.py
          ruff check scripts/render_readme_results.py
          ruff format --check scripts/render_readme_results.py
          python scripts/render_readme_results.py --check --update-readmes
          git diff --check
      - name: Publish only the documentation changes
        run: |
          git add README.md README_zh.md assets/results/ scripts/render_readme_results.py
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          allowed = {'README.md', 'README_zh.md', 'scripts/render_readme_results.py', 'assets/results/data.json'}
          allowed.update(f'assets/results/{model}_savings_{lang}.svg' for model in ('codex', 'claude') for lang in ('en', 'zh'))
          if not changed or not changed <= allowed:
              raise SystemExit(f'Unexpected changed files: {sorted(changed - allowed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: show bilingual result figures and trim onboarding prose'
          git push origin HEAD:main
