name: Bug or installation problem
description: Report a reproducible problem with a small synthetic example.
body:
  - type: markdown
    attributes:
      value: "Use synthetic input. Do not include API keys, private conversations, benchmark text or reader payloads. See SECURITY.md for sensitive reports."
  - type: input
    id: version
    attributes:
      label: Revision and environment
      placeholder: Commit SHA, Python version, OS; browser if using the demo
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal steps and synthetic input
      description: Include query, strategy, budget and tokenizer when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and actual result
    validations:
      required: true
